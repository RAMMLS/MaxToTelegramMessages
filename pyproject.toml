[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "max-to-telegram"
version = "0.1.0"
description = "Personal bridge that forwards selected MAX web messages to Telegram"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RAMMLS" }]
dependencies = [
  "aiohttp>=3.9,<4",
  "lz4>=4.3,<5",
  "msgpack>=1.0,<2",
  "python-dotenv>=1.0,<2",
  "websockets>=13,<16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
max-to-telegram = "max_to_telegram.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

